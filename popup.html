<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Source Code File Downloader</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f9;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .container {
        text-align: center;
        background-color: #393636;
        padding: 10px 10px 5px 10px;
        position: relative;
      }
      h2 {
        color: #e5e5e5;
        margin-bottom: 20px;
      }
      button {
        margin: 25px 0 0 0;
        padding: 10px 50px;
        font-size: 15px;
        color: #fff;
        background-color: #747b83;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: background-color 0.3s;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.16),
          0 6px 20px rgba(0, 0, 0, 0.23);
        white-space: normal;
        width: 200px;
      }
      button:hover {
        background-color: #0056b3;
      }
      #result {
        margin-top: 20px;
        font-size: 12px;
        color: #949292;
      }

      .popout-button {
        position: relative;
        z-index: 1;
        background-color: #5e6975;
      }
      .popout-background {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: black;
        opacity: 0.8;
        z-index: -1;
        border-radius: 10px;
      }

      /* GitHub Icon styles */
      .github-icon {
        position: absolute;
        top: 10px;
        right: 10px;
        color: #e5e5e5;
        text-decoration: none;
        z-index: 2; /* Ensure the icon is above other elements */
      }

      .github-icon svg {
        width: 15px;
        height: 15px;
        fill: #e5e5e5; /* Ensure the SVG is colored correctly */
      }
    </style>
  </head>
  <body>
    <div class="container" role="main">
      <!-- GitHub Icon -->
      <a
        href="https://github.com/ziruichen97/Source-Code-File-Downloader"
        target="_blank"
        class="github-icon"
      >
        <svg
          height="32"
          aria-hidden="true"
          viewBox="0 0 16 16"
          version="1.1"
          width="32"
          data-view-component="true"
          class="octicon octicon-mark-github v-align-middle"
          role="img"
        >
          <path
            fill-rule="evenodd"
            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
          ></path>
        </svg>
      </a>

      <!-- Existing content -->
      <button
        id="grabResources"
        aria-label="Download resources"
        class="popout-button"
      >
        Download Source Code
      </button>
      <div id="result"></div>
      <div class="popout-background"></div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
